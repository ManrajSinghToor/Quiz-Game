server.port=${PORT:8080}
server.address=0.0.0.0

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://127.0.0.1:27017/quizdb}

# JWT Configuration
jwt.secret=${JWT_SECRET:supersecretkey123}

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}

# Mail Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:manrajtoorsingh@gmail.com}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App URLs
app.frontend-url=${FRONTEND_URL:https://quiz-game-six-blue.vercel.app}
app.backend-url=${BACKEND_URL:https://quiz-game-backend-9tet.onrender.com}

# Optional Resend / Brevo API Keys
resend.api.key=${RESEND_API_KEY:}
brevo.api.key=${BREVO_API_KEY:}

# Static resource handling for React dist
spring.web.resources.static-locations=file:../Frontend/dist/,file:Frontend/dist/,classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

